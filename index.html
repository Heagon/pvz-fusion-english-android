<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plants vs. Zombies: Fusion (Android) — [VI] Bản Việt Hóa · [EN] English · [CN] 简体中文</title>
  <meta name="description" content="Unofficial Android Multi-Language Suite for Plants vs. Zombies: Fusion (v4.0.5.2 Stable & v4.1 Preview). No Root, 100% Save-Preserving Updates across VI / EN / CN.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Plants vs. Zombies: Fusion (Android) — Multi-Language Suite">
  <meta property="og:description" content="[VI] Bản Việt Hóa · [EN] English · [CN] 中文原版 — Cài đè giữ nguyên 100% Save · No Root Required.">
  <meta property="og:image" content="https://raw.githubusercontent.com/Heagon/pvz-fusion-english-android/main/screenshots/vi_4052_01_main_menu.png">
  <script>
    (function () {
      var BASE = "https://github.com/Heagon/pvz-fusion-english-android";
      var DEST = {
        vi: BASE + "/blob/main/README.vi.md",
        cn: BASE + "/blob/main/README.cn.md",
        en: BASE + "#readme"
      };

      try {
        var q = new URLSearchParams(window.location.search).get("lang");
        if (q) {
          q = q.toLowerCase();
          if (q.indexOf("vi") === 0) { window.location.replace(DEST.vi); return; }
          if (q.indexOf("zh") === 0 || q === "cn") { window.location.replace(DEST.cn); return; }
          if (q.indexOf("en") === 0) { window.location.replace(DEST.en); return; }
        }

        var langs = (navigator.languages && navigator.languages.length)
          ? navigator.languages
          : [navigator.language || navigator.userLanguage || ""];

        for (var i = 0; i < langs.length; i++) {
          var l = String(langs[i] || "").toLowerCase();
          if (l.indexOf("vi") === 0) { window.location.replace(DEST.vi); return; }
          if (l.indexOf("zh") === 0) { window.location.replace(DEST.cn); return; }
        }

        var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "").toLowerCase();
        if (tz === "asia/ho_chi_minh" || tz === "asia/saigon" || tz === "asia/hanoi") {
          window.location.replace(DEST.vi);
          return;
        }
        if (tz === "asia/shanghai" || tz === "asia/chongqing" || tz === "asia/harbin" || tz === "asia/urumqi") {
          window.location.replace(DEST.cn);
          return;
        }
      } catch (e) {}

      window.location.replace(DEST.en);
    })();
  </script>

    body {
      margin: 0;
